[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xyzac-slicer"
version = "0.1.0"
description = "Slicer soustractif 5 axes pour centre d'usinage maker XYZAC"
requires-python = ">=3.11"
# Licence produit volontairement non déclarée : voir ADR-001 / D10 et ADR-002 (à venir).
dependencies = [
    "cadquery-ocp>=7.7",   # OCCT via bindings OCP. Wheels x86_64 + aarch64 (Pi 5).
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "trimesh>=4.0"]
# Banc de debug visuel (src/xyzac/ui/debug). Jamais requis par le moteur :
# aucun module de calcul n'importe PySide6 ni PyVista, et un test le verifie.
#
# PySide6-Essentials plutot que PySide6 : le paquet complet embarque WebEngine,
# Charts, 3D et Multimedia, soit ~450 Mo dont le banc n'utilise rien. Sur la
# cible embarquee (Raspberry Pi 5) la difference n'est pas cosmetique.
ui = ["PySide6-Essentials>=6.6", "pyvista>=0.44", "pyvistaqt>=0.11", "pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov"]
# Backends optionnels, jamais dans le paquet coeur (licences : voir docs/audit/).
ocl = ["opencamlib"]        # LGPL-2.1

[tool.setuptools.packages.find]
where = ["src"]

# La page de l'atelier (HTML, CSS, JS) n'est pas du code Python : sans cette
# declaration elle est absente d'une installation non editable, et le defaut
# ne se voit qu'au moment ou l'on installe sur la machine cible.
[tool.setuptools.package-data]
"xyzac.ui.atelier" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests longs (corpus complet)",
    "needs_occt: necessite OCCT/OCP",
    "needs_render: necessite un rendu 3D (OSMesa, EGL ou un ecran)",
]
